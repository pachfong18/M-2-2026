<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srisuvit Quest - Pro Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo-glow"><i class="fa-solid fa-ghost"></i></div>
            <h1 class="pixel-font">Srisuvit<br>Quest v3.0</h1>
        </div>
        
        <div id="menu-items" class="hidden">
            <div class="nav-btn pixel-font active" onclick="showPage('dashboard', this)"><i class="fa-solid fa-gauge-high"></i> Dashboard</div>
            <div class="nav-btn pixel-font" onclick="showPage('quests', this)"><i class="fa-solid fa-map-location-dot"></i> Quest Board</div>
            <div class="nav-btn pixel-font detective-btn" onclick="showPage('detective', this)"><i class="fa-solid fa-magnifying-glass"></i> Detective</div>
            <div class="nav-btn pixel-font" onclick="showPage('status', this)"><i class="fa-solid fa-id-card"></i> Character</div>
            
            <div id="teacher-btn" class="nav-btn pixel-font teacher-btn hidden" onclick="showPage('teacher', this)">
                <i class="fa-solid fa-fingerprint"></i> Kru Beer Panel
            </div>
            
            <div class="nav-btn pixel-font logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="content-card">
            <div id="login-section">
                <h2 class="pixel-font aqua-glow">>>> User Login</h2>
                <input type="text" id="username" placeholder="รหัสนักเรียน 5 หลัก">
                <input type="password" id="password" placeholder="รหัสผ่าน">
                <button class="btn-p pixel-font" style="width:100%; margin-top:20px;" onclick="login()">Enter System</button>
                <p class="auth-link" onclick="toggleAuth('reg')">สร้างตัวละครใหม่</p>
            </div>

            <div id="reg-section" class="hidden">
                <h2 class="pixel-font" style="color:#fff;">>>> New Character</h2>
                <input type="text" id="regName" placeholder="ชื่อ-นามสกุลจริง">
                <input type="text" id="regId" placeholder="รหัสนักเรียน 5 หลัก">
                <input type="password" id="regPass" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)">
                <button class="btn-p pixel-font" style="width:100%;" onclick="register()">Create Account</button>
                <p class="auth-link" onclick="toggleAuth('login')">มีตัวละครแล้ว? ล็อกอินที่นี่</p>
            </div>

            <div id="game-content" class="hidden"></div>
        </div>
    </main>

    <div class="status-bar">
        <span><i class="fa-solid fa-user-tag"></i> <span id="st-name">...</span></span>
        <span><i class="fa-solid fa-bolt-lightning"></i> MP: <span id="st-mp">0</span> | LV: <span id="st-lv">1</span></span>
        <span><i class="fa-solid fa-location-arrow"></i> SRISUVIT M.2</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
